# lib-packages.conf - System libraries needed by CPAN XS modules (UBI/RHEL).
#
# Single source of truth for the two package lists that otherwise have to be
# kept in sync by hand: `base` installs the runtime lib, `dev-tools` installs
# the matching -devel headers so the same lib's XS modules can compile.
#
# Format: one entry per line, RUNTIME_PACKAGE|DEVEL_PACKAGE|NEEDED BY
#   - `base`      installs column 1 (skipped if empty)
#   - `dev-tools` installs column 2 (skipped if empty)
#   - column 3 is documentation only, not parsed — which cpanfile module(s)
#     actually need this library, so a reader doesn't have to go hunting.
# `|` is the delimiter (not `:`) because Perl module names contain `::`,
# which would otherwise collide with a `:`-based split.
#
# Columns 1 and 2 are space-padded for readability — purely cosmetic, safe to
# reflow by hand. The Containerfile's awk trims whitespace from each field
# before checking it against "" and before printing it, so padding a column
# doesn't turn an intentionally-empty one non-empty (verified: without the
# trim, a padded empty field became a bare `microdnf install` with no
# packages, which errors).
#
# A line with an empty column 1 (e.g. `|subversion-devel|...`) is devel-only —
# dev-tools needs it but there's no matching runtime package. A line with an
# empty column 2 (e.g. `libaio||...`) is runtime-only — no -devel package
# exists/is needed for it.
#
# NOT listed here: generic build tools (gcc, make, perl-core, perl-devel,
# which, util-linux, findutils, tar, gzip, unzip, patch) — those aren't
# per-library pairs, they stay as an explicit list in the dev-tools stage.
#
# RHEL/UBI package names only. Not portable to other package managers
# (apt/apk name these differently) — this repo is UBI/RHEL-native by design.

libaio              |                           | Oracle Instant Client (DBD::Oracle) — async I/O, not a Perl module itself
libdb               |                           | BerkeleyDB
libpq               | postgresql-devel          | DBD::Pg
mariadb-connector-c | mariadb-connector-c-devel | DBD::mysql
gd                  | gd-devel                  | GD
libpng              | libpng-devel              | GD (PNG support)
libjpeg-turbo       | libjpeg-turbo-devel       | GD (JPEG support)
freetype            | freetype-devel            | GD, Font::TTF (font rendering)
libxml2             | libxml2-devel             | XML::LibXML, XML::LibXML::Simple
libxslt             | libxslt-devel             | transitive — linked by libxml2-based XML processing; no module in cpanfile requires it directly
expat               | expat-devel               | XML::Parser, XML::Parser::Lite, XML::SAX, XML::SAX::Base, XML::SAX::Expat
openssl-libs        | openssl-devel             | Net::SSLeay, IO::Socket::SSL, LWP::Protocol::https
zlib                | zlib-devel                | Archive::Zip; also linked by XLSX-format modules (Spreadsheet::XLSX, Excel::Writer::XLSX, Excel::ValueReader::XLSX, etc. — XLSX is a zip container)
bzip2-libs          | bzip2-devel               | transitive — no module in cpanfile requires it directly; core IO::Compress::Bzip2 uses it if compiled with support
xz-libs             | xz-devel                  | transitive — no module in cpanfile requires it directly; core IO::Compress::Lzma uses it if compiled with support
                    | subversion-devel          | Historically for SVN::Hooks, SVN::Look, SVN::Notify — none of the three are in cpanfile anymore (removed as dead commented-out lines). No other module in cpanfile references Subversion. Likely removable; kept until someone confirms nothing else needs it transitively
