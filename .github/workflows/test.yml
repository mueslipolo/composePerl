name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh tests/container-build/setup.sh tests/mitm-proxy/generate-test-ca.sh

      - name: Install hadolint
        run: |
          curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint

      - name: hadolint Containerfile
        run: hadolint Containerfile

      - name: hadolint Containerfile.deps
        run: hadolint Containerfile.deps

  bats:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install bats-core
        run: |
          git clone --depth 1 --branch v1.11.1 \
            https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Run bats tests
        run: bats tests/bats/

  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install cpanm, Carton, and cpm
        run: |
          curl -fsSL https://cpanmin.us -o /tmp/cpanm
          perl /tmp/cpanm --notest -n -l ~/perl5 Carton App::cpm
          echo "$HOME/perl5/bin" >> "$GITHUB_PATH"
          echo "PERL5LIB=$HOME/perl5/lib/perl5" >> "$GITHUB_ENV"

      # ── Phase 1: install from committed snapshot ──────────────────────────────
      # carton install (no --deployment) downloads pinned versions from CPAN using
      # cpanfile.snapshot as a strict lock. --deployment would require a pre-built
      # vendor/ cache that is not committed to the repo.

      - name: carton install (resolve pinned snapshot from CPAN)
        working-directory: tests/integration
        run: carton install

      - name: carton bundle (build offline vendor/cache)
        working-directory: tests/integration
        run: carton bundle

      - name: Create bundle tarball
        working-directory: tests/integration
        run: tar czf /tmp/cpan-bundle.tar.gz ./vendor cpanfile cpanfile.snapshot

      - name: cpm install from bundle (offline — mirrors perl-modules Containerfile stage)
        run: |
          mkdir -p /tmp/work-orig /tmp/perl-install
          tar xzf /tmp/cpan-bundle.tar.gz -C /tmp/work-orig
          rm /tmp/work-orig/cpanfile.snapshot
          cd /tmp/work-orig && cpm install -L /tmp/perl-install \
            --resolver "02packages,file://$PWD/vendor/cache"

      - name: Verify modules load from bundle
        run: PERL5LIB=/tmp/perl-install/lib/perl5 perl tests/integration/test-load.pl

      # ── Phase 2: carton update (tests the MR1 fix at real Carton level) ───────
      # Snapshot pins Try::Tiny to 0.30 and DBD::SQLite to 1.74 — both below
      # current CPAN versions. carton update Try::Tiny must:
      #   • bump Try::Tiny to the latest version (non-trivial update)
      #   • leave DBD::SQLite at 1.74 (not updated — scoped update guard)
      # If carton update were replaced with carton install (the MR1 bug), it
      # would be a no-op and Try::Tiny would stay at 0.30, failing the assertion.

      - name: carton update Try::Tiny (single-module update, scoped assertion)
        working-directory: tests/integration
        run: |
          before_try=$(grep "pathname.*Try-Tiny" cpanfile.snapshot)
          before_dbd=$(grep "pathname.*DBD-SQLite" cpanfile.snapshot)
          before_dbi=$(grep "pathname.*DBI-" cpanfile.snapshot)

          carton update Try::Tiny

          after_try=$(grep "pathname.*Try-Tiny" cpanfile.snapshot)
          after_dbd=$(grep "pathname.*DBD-SQLite" cpanfile.snapshot)
          after_dbi=$(grep "pathname.*DBI-" cpanfile.snapshot)

          echo "Try::Tiny before: $before_try"
          echo "Try::Tiny after:  $after_try"
          echo "DBD::SQLite:      $before_dbd (unchanged)"

          if [ "$before_try" = "$after_try" ]; then
            echo "FAIL: carton update Try::Tiny made no change — snapshot still pinned to $before_try"
            exit 1
          fi
          if [ "$before_dbd" != "$after_dbd" ]; then
            echo "FAIL: carton update Try::Tiny changed DBD::SQLite ($before_dbd -> $after_dbd)"
            exit 1
          fi
          if [ "$before_dbi" != "$after_dbi" ]; then
            echo "FAIL: carton update Try::Tiny changed DBI ($before_dbi -> $after_dbi)"
            exit 1
          fi
          echo "OK: Try::Tiny updated, DBD::SQLite and DBI unchanged"

      - name: Re-bundle after update
        working-directory: tests/integration
        run: |
          carton bundle
          tar czf /tmp/cpan-bundle-updated.tar.gz ./vendor cpanfile cpanfile.snapshot

      - name: cpm install from updated bundle (offline)
        run: |
          mkdir -p /tmp/work-updated /tmp/perl-install-updated
          tar xzf /tmp/cpan-bundle-updated.tar.gz -C /tmp/work-updated
          rm /tmp/work-updated/cpanfile.snapshot
          cd /tmp/work-updated && cpm install -L /tmp/perl-install-updated \
            --resolver "02packages,file://$PWD/vendor/cache"

      - name: Verify modules load from updated bundle and Try::Tiny was upgraded
        run: PERL5LIB=/tmp/perl-install-updated/lib/perl5 perl tests/integration/test-load-updated.pl

  container-build:
    # Full end-to-end Containerfile build against the curated ~11-module test
    # cpanfile (tests/container-build/). Exercises perl-src compile, all four
    # stages of Containerfile, Containerfile.deps, deps.sh, build-image.sh,
    # and the Oracle Instant Client extraction path.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman

      - name: Cache artifacts/ and artifacts.sha256
        uses: actions/cache@v5
        with:
          # artifacts.sha256 is the lockfile fetch-artifacts.sh pins hashes
          # into — it must be cached alongside artifacts/ itself, or every
          # run re-pins from scratch on trust-on-first-use with nothing to
          # verify against, defeating the point of pinning.
          path: |
            artifacts
            artifacts.sha256
          # Rebuild cache whenever the fetch script (URLs or pins) changes.
          key: artifacts-${{ hashFiles('scripts/fetch-artifacts.sh') }}

      - name: Fetch artifacts (skipped when cache hit)
        run: scripts/fetch-artifacts.sh

      - name: Assemble container-build workspace
        id: workspace
        run: echo "WORKDIR=$(bash tests/container-build/setup.sh)" >> "$GITHUB_OUTPUT"

      - name: make bundle (perl-src compile + carton install + carton bundle)
        working-directory: ${{ steps.workspace.outputs.WORKDIR }}
        run: make bundle

      - name: make all (base + dev + runtime)
        working-directory: ${{ steps.workspace.outputs.WORKDIR }}
        run: make all

      - name: make test-load-dev
        working-directory: ${{ steps.workspace.outputs.WORKDIR }}
        run: make test-load-dev

      - name: make test-load-runtime
        working-directory: ${{ steps.workspace.outputs.WORKDIR }}
        run: make test-load-runtime

      - name: Invariant checks (no build tools in runtime, non-root user, bundle-hash label)
        working-directory: ${{ steps.workspace.outputs.WORKDIR }}
        run: |
          set -e

          # Runtime must have no gcc/make
          if podman run --rm myapp:runtime sh -c 'command -v gcc || command -v make' 2>/dev/null; then
            echo "FAIL: runtime image contains build tools"
            exit 1
          fi
          echo "OK: runtime has no build tools"

          # Runtime must run as uid 1001
          uid=$(podman run --rm myapp:runtime id -u)
          if [ "$uid" != "1001" ]; then
            echo "FAIL: runtime uid=$uid, expected 1001"
            exit 1
          fi
          echo "OK: runtime runs as uid 1001"

          # Bundle hash label must match cpanfile.snapshot hash
          snapshot_hash=$(sha256sum cpanfile.snapshot | cut -c1-12)
          image_hash=$(podman inspect myapp:runtime --format '{{index .Config.Labels "bundle.hash"}}')
          if [ "$snapshot_hash" != "$image_hash" ]; then
            echo "FAIL: bundle-hash label='$image_hash' != cpanfile.snapshot hash='$snapshot_hash'"
            exit 1
          fi
          echo "OK: bundle-hash label matches snapshot ($image_hash)"

  enterprise-proxy:
    # Validates enterprise-proxy + custom-CA support against a REAL
    # TLS-inspecting (MITM) proxy (tests/mitm-proxy/) — not a mock. A plain
    # CONNECT-tunnel proxy never touches the TLS bytes, so it can't prove CA
    # trust actually matters; this exercises a genuine interception scenario
    # for the two network-touching paths outside the VM/perlbrew path
    # (covered separately by the vm-deployment job): scripts/fetch-artifacts.sh
    # (host-side curl) and the Containerfile's perl-src stage (microdnf, via
    # certs/ + update-ca-trust).
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman

      - name: Cache artifacts/ and artifacts.sha256
        uses: actions/cache@v5
        with:
          path: |
            artifacts
            artifacts.sha256
          key: artifacts-${{ hashFiles('scripts/fetch-artifacts.sh') }}

      - name: Fetch artifacts (skipped when cache hit) — feeds the Containerfile-build case below
        run: scripts/fetch-artifacts.sh

      - name: Generate throwaway test CA + leaf cert
        run: |
          tests/mitm-proxy/generate-test-ca.sh /tmp/test-ca \
            www.cpan.org fastapi.metacpan.org raw.githubusercontent.com \
            download.oracle.com www.oracle.com cdn-ubi.redhat.com

      - name: Start the MITM proxy
        run: |
          nohup python3 tests/mitm-proxy/mitm_proxy.py 8899 /tmp/test-ca/leaf.pem /tmp/test-ca/leaf.key \
            > /tmp/mitm-proxy.log 2>&1 &
          sleep 1

      - name: fetch-artifacts.sh through the proxy WITHOUT CA trust (must fail)
        run: |
          rm -rf /tmp/fetch-test-negative
          mkdir -p /tmp/fetch-test-negative/scripts /tmp/fetch-test-negative/artifacts
          cp scripts/fetch-artifacts.sh /tmp/fetch-test-negative/scripts/
          cp Containerfile /tmp/fetch-test-negative/
          cd /tmp/fetch-test-negative
          if http_proxy=http://127.0.0.1:8899 https_proxy=http://127.0.0.1:8899 bash scripts/fetch-artifacts.sh; then
            echo "FAIL: fetch-artifacts.sh succeeded through the MITM proxy without CA trust (should have failed TLS verification)"
            exit 1
          fi
          echo "OK: correctly failed without CA trust"

      - name: fetch-artifacts.sh through the proxy WITH CA trust (must succeed)
        run: |
          rm -rf /tmp/fetch-test-positive
          mkdir -p /tmp/fetch-test-positive/scripts /tmp/fetch-test-positive/artifacts
          cp scripts/fetch-artifacts.sh /tmp/fetch-test-positive/scripts/
          cp Containerfile /tmp/fetch-test-positive/
          # Reuse the already-fetched (licensed) Oracle zips — only
          # perl/cpanm/cpm need a real fetch to prove the mechanism.
          cp artifacts/instantclient-*.zip /tmp/fetch-test-positive/artifacts/
          cd /tmp/fetch-test-positive
          http_proxy=http://127.0.0.1:8899 https_proxy=http://127.0.0.1:8899 \
            CURL_CA_BUNDLE=/tmp/test-ca/test-ca.pem \
            bash scripts/fetch-artifacts.sh
          echo "OK: succeeded with CA trust; artifacts fetched through the proxy"

      - name: Containerfile perl-src stage through the proxy WITHOUT CA trust (must fail)
        run: |
          rm -rf /tmp/build-test-negative
          mkdir -p /tmp/build-test-negative/artifacts /tmp/build-test-negative/certs
          cp Containerfile /tmp/build-test-negative/
          PERL_VERSION="$(sed -n 's/^ARG PERL_VERSION=//p' Containerfile)"
          cp "artifacts/perl-${PERL_VERSION}.tar.gz" /tmp/build-test-negative/artifacts/
          touch /tmp/build-test-negative/certs/.gitkeep
          cd /tmp/build-test-negative
          if podman build --no-cache --target perl-src -t proxy-negative-test:perl-src \
              --build-arg "PERL_VERSION=${PERL_VERSION}" \
              --build-arg http_proxy=http://host.containers.internal:8899 \
              --build-arg https_proxy=http://host.containers.internal:8899 .; then
            echo "FAIL: Containerfile build succeeded through the MITM proxy without CA trust"
            exit 1
          fi
          echo "OK: correctly failed without CA trust"

      - name: Containerfile perl-src stage through the proxy WITH CA trust (must succeed)
        run: |
          rm -rf /tmp/build-test-positive
          mkdir -p /tmp/build-test-positive/artifacts /tmp/build-test-positive/certs
          cp Containerfile /tmp/build-test-positive/
          PERL_VERSION="$(sed -n 's/^ARG PERL_VERSION=//p' Containerfile)"
          cp "artifacts/perl-${PERL_VERSION}.tar.gz" /tmp/build-test-positive/artifacts/
          cp /tmp/test-ca/test-ca.pem /tmp/build-test-positive/certs/
          cd /tmp/build-test-positive
          podman build --no-cache --target perl-src -t proxy-positive-test:perl-src \
            --build-arg "PERL_VERSION=${PERL_VERSION}" \
            --build-arg http_proxy=http://host.containers.internal:8899 \
            --build-arg https_proxy=http://host.containers.internal:8899 .
          echo "OK: succeeded with CA trust; perl-src built through the proxy"

      - name: Show proxy access log (evidence real traffic flowed through it)
        if: always()
        run: cat /tmp/mitm-proxy.log

  vm-deployment:
    # Full end-to-end perlbrew/VM deployment test (docs/vm-deployment.md)
    # against the curated ~11-module test cpanfile. Simulates a bare legacy
    # VM with a plain UBI9 container (not this repo's own Containerfile) and
    # runs the real scripts/vm-*.sh against it, including a real enterprise
    # proxy + custom CA pass (tests/mitm-proxy/, same tool as enterprise-proxy).
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman

      - name: Cache artifacts/ and artifacts.sha256
        uses: actions/cache@v5
        with:
          path: |
            artifacts
            artifacts.sha256
          key: artifacts-${{ hashFiles('scripts/fetch-artifacts.sh') }}

      - name: Fetch artifacts (skipped when cache hit)
        run: scripts/fetch-artifacts.sh

      - name: Assemble container-build workspace
        id: workspace
        run: echo "WORKDIR=$(bash tests/container-build/setup.sh)" >> "$GITHUB_OUTPUT"

      - name: make bundle (curated ~11-module test cpanfile)
        working-directory: ${{ steps.workspace.outputs.WORKDIR }}
        run: make bundle

      - name: Start the simulated VM container (plain UBI9, no perlbrew)
        run: |
          podman run -d --name vm-deploy-test registry.access.redhat.com/ubi9/ubi-minimal:9.6 sleep infinity
          podman exec vm-deploy-test microdnf install -y perl gcc make tar gzip findutils patch unzip

      - name: Install runtime + devel system libraries (same lib-packages.conf the container path uses)
        run: |
          podman cp lib-packages.conf vm-deploy-test:/tmp/lib-packages.conf
          podman exec vm-deploy-test bash -c '
            microdnf -y install $(awk -F"|" "/^[[:space:]]*#/{next} /^[[:space:]]*\$/{next} \$1!=\"\"{print \$1}" /tmp/lib-packages.conf)
            microdnf -y install $(awk -F"|" "/^[[:space:]]*#/{next} /^[[:space:]]*\$/{next} \$2!=\"\"{print \$2}" /tmp/lib-packages.conf)
            rm -f /tmp/lib-packages.conf
          '

      - name: Stage Oracle Instant Client (same as dev-tools stage)
        run: |
          podman cp artifacts/instantclient-basiclite-linux.x64-23.8.0.25.04.zip vm-deploy-test:/tmp/
          podman cp artifacts/instantclient-sdk-linux.x64-23.8.0.25.04.zip vm-deploy-test:/tmp/
          podman exec vm-deploy-test bash -c '
            unzip -o -q /tmp/instantclient-basiclite*.zip -d /opt/oracle
            mv /opt/oracle/instantclient_* /opt/oracle/instantclient
            rm -f /opt/oracle/instantclient/*.jar /opt/oracle/instantclient/libocci.so
            unzip -o -q /tmp/instantclient-sdk*.zip -d /opt/oracle-sdk-extract
            mv /opt/oracle-sdk-extract/instantclient_*/sdk /opt/oracle/instantclient/sdk
            rm -rf /opt/oracle-sdk-extract /tmp/instantclient-*.zip
          '

      - name: Stage scripts, cpm, and the bundle onto the simulated VM
        run: |
          PERL_VERSION="$(sed -n 's/^ARG PERL_VERSION=//p' Containerfile)"
          BUNDLE_DIR="${{ steps.workspace.outputs.WORKDIR }}/bundles"
          podman exec vm-deploy-test mkdir -p /vm-deploy
          podman cp scripts/vm-bootstrap-perlbrew.sh vm-deploy-test:/vm-deploy/
          podman cp scripts/vm-check-compat.sh vm-deploy-test:/vm-deploy/
          podman cp scripts/vm-install-bundle.sh vm-deploy-test:/vm-deploy/
          podman cp "artifacts/$(readlink artifacts/cpm)" vm-deploy-test:/vm-deploy/cpm
          podman cp "artifacts/perl-${PERL_VERSION}.tar.gz" vm-deploy-test:/vm-deploy/perl-src.tar.gz
          podman cp "${BUNDLE_DIR}/$(readlink "${BUNDLE_DIR}/bundle-latest.tar.gz")" vm-deploy-test:/vm-deploy/bundle.tar.gz
          podman cp "${BUNDLE_DIR}/$(readlink "${BUNDLE_DIR}/bundle-latest.build-info")" vm-deploy-test:/vm-deploy/bundle.build-info
          podman exec vm-deploy-test chmod +x /vm-deploy/vm-bootstrap-perlbrew.sh /vm-deploy/vm-check-compat.sh /vm-deploy/vm-install-bundle.sh /vm-deploy/cpm

      - name: Bootstrap perlbrew + pinned Perl (offline, using the cached source tarball)
        run: |
          podman exec -w /vm-deploy vm-deploy-test bash -c '
            export HOME=/root
            PERL_VERSION="$(sed -n "s/^PERL_VERSION=//p" bundle.build-info)"
            ./vm-bootstrap-perlbrew.sh "$PERL_VERSION" ./perl-src.tar.gz
          '

      - name: Version-compatibility gate
        run: |
          podman exec -w /vm-deploy vm-deploy-test bash -c '
            export HOME=/root
            export PERLBREW_ROOT=/root/perl5/perlbrew
            ./vm-check-compat.sh bundle.build-info
          '

      - name: Install the bundle into a perlbrew lib
        run: |
          podman exec -w /vm-deploy vm-deploy-test bash -c '
            export HOME=/root
            export PERLBREW_ROOT=/root/perl5/perlbrew
            export LD_LIBRARY_PATH=/opt/oracle/instantclient
            export ORACLE_HOME=/opt/oracle/instantclient
            ./vm-install-bundle.sh bundle.tar.gz bundle.build-info myapp ./cpm
          '

      - name: Verify with a real test app, not just a require loop
        run: |
          podman exec vm-deploy-test mkdir -p /vm-deploy/tests
          podman cp tests/module-load-test.pl vm-deploy-test:/vm-deploy/tests/
          podman cp tests/TestConfig.pm vm-deploy-test:/vm-deploy/tests/
          podman cp tests/container-build/test-load.pl vm-deploy-test:/vm-deploy/tests/
          podman cp tests/container-build/cpanfile vm-deploy-test:/vm-deploy/tests/
          podman exec vm-deploy-test bash -c '
            export HOME=/root
            export PERLBREW_ROOT=/root/perl5/perlbrew
            export PERLBREW_PERL="perl-$(sed -n "s/^PERL_VERSION=//p" /vm-deploy/bundle.build-info)"
            export PERLBREW_LIB=myapp
            export LD_LIBRARY_PATH=/opt/oracle/instantclient
            export ORACLE_HOME=/opt/oracle/instantclient
            source /root/perl5/perlbrew/etc/bashrc
            cp /vm-deploy/tests/cpanfile /tmp/cpanfile
            : > /tmp/test-config.conf
            perl /vm-deploy/tests/module-load-test.pl
            perl /vm-deploy/tests/test-load.pl --expect-try-tiny-max=0.30
          '

      - name: Enterprise proxy + custom CA — negative case (must fail without VM_CA_CERT)
        run: |
          tests/mitm-proxy/generate-test-ca.sh /tmp/vm-test-ca install.perlbrew.pl raw.githubusercontent.com
          nohup python3 tests/mitm-proxy/mitm_proxy.py 8898 /tmp/vm-test-ca/leaf.pem /tmp/vm-test-ca/leaf.key \
            > /tmp/vm-mitm-proxy.log 2>&1 &
          sleep 1

          podman run -d --name vm-proxy-test registry.access.redhat.com/ubi9/ubi-minimal:9.6 sleep infinity
          podman exec vm-proxy-test microdnf install -y perl gcc make tar gzip findutils patch
          podman exec vm-proxy-test mkdir -p /vm-deploy
          podman cp scripts/vm-bootstrap-perlbrew.sh vm-proxy-test:/vm-deploy/
          PERL_VERSION="$(sed -n 's/^ARG PERL_VERSION=//p' Containerfile)"
          podman cp "artifacts/perl-${PERL_VERSION}.tar.gz" vm-proxy-test:/vm-deploy/perl-src.tar.gz
          podman exec vm-proxy-test chmod +x /vm-deploy/vm-bootstrap-perlbrew.sh

          if podman exec -w /vm-deploy vm-proxy-test bash -c "
              export HOME=/root
              export https_proxy=http://host.containers.internal:8898
              export http_proxy=http://host.containers.internal:8898
              ./vm-bootstrap-perlbrew.sh ${PERL_VERSION} ./perl-src.tar.gz
          "; then
            echo "FAIL: vm-bootstrap-perlbrew.sh succeeded through the MITM proxy without VM_CA_CERT"
            exit 1
          fi
          echo "OK: correctly failed without CA trust"

      - name: Enterprise proxy + custom CA — positive case (must succeed with VM_CA_CERT)
        run: |
          podman cp /tmp/vm-test-ca/test-ca.pem vm-proxy-test:/vm-deploy/corp-ca.pem
          podman exec vm-proxy-test rm -rf /root/perl5
          PERL_VERSION="$(sed -n 's/^ARG PERL_VERSION=//p' Containerfile)"
          podman exec -w /vm-deploy vm-proxy-test bash -c "
            export HOME=/root
            export https_proxy=http://host.containers.internal:8898
            export http_proxy=http://host.containers.internal:8898
            export VM_CA_CERT=/vm-deploy/corp-ca.pem
            ./vm-bootstrap-perlbrew.sh ${PERL_VERSION} ./perl-src.tar.gz
          "
          echo "OK: succeeded with VM_CA_CERT trust; perlbrew installed through the proxy"

      - name: Show proxy access logs (evidence real traffic flowed through them)
        if: always()
        run: |
          echo "=== vm-mitm-proxy.log ===" ; cat /tmp/vm-mitm-proxy.log || true
