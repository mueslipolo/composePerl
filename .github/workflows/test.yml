name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bats:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        run: |
          git clone --depth 1 --branch v1.11.1 \
            https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Run bats tests
        run: bats tests/bats/

  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cpanm, Carton, and cpm
        run: |
          curl -fsSL https://cpanmin.us -o /tmp/cpanm
          perl /tmp/cpanm --notest -n -l ~/perl5 Carton App::cpm
          echo "$HOME/perl5/bin" >> "$GITHUB_PATH"
          echo "PERL5LIB=$HOME/perl5/lib/perl5" >> "$GITHUB_ENV"

      # ── Phase 1: install from committed snapshot ──────────────────────────────
      # carton install (no --deployment) downloads pinned versions from CPAN using
      # cpanfile.snapshot as a strict lock. --deployment would require a pre-built
      # vendor/ cache that is not committed to the repo.

      - name: carton install (resolve pinned snapshot from CPAN)
        working-directory: tests/integration
        run: carton install

      - name: carton bundle (build offline vendor/cache)
        working-directory: tests/integration
        run: carton bundle

      - name: Create bundle tarball
        working-directory: tests/integration
        run: tar czf /tmp/cpan-bundle.tar.gz ./vendor cpanfile cpanfile.snapshot

      - name: cpm install from bundle (offline — mirrors perl-modules Containerfile stage)
        run: |
          mkdir -p /tmp/work-orig /tmp/perl-install
          tar xzf /tmp/cpan-bundle.tar.gz -C /tmp/work-orig
          rm /tmp/work-orig/cpanfile.snapshot
          cd /tmp/work-orig && cpm install -L /tmp/perl-install \
            --resolver "02packages,file://$PWD/vendor/cache"

      - name: Verify modules load from bundle
        run: PERL5LIB=/tmp/perl-install/lib/perl5 perl tests/integration/test-load.pl

      # ── Phase 2: carton update (tests the MR1 fix at real Carton level) ───────
      # Snapshot pins Try::Tiny to 0.30 and DBD::SQLite to 1.74 — both below
      # current CPAN versions. carton update Try::Tiny must:
      #   • bump Try::Tiny to the latest version (non-trivial update)
      #   • leave DBD::SQLite at 1.74 (not updated — scoped update guard)
      # If carton update were replaced with carton install (the MR1 bug), it
      # would be a no-op and Try::Tiny would stay at 0.30, failing the assertion.

      - name: carton update Try::Tiny (single-module update, scoped assertion)
        working-directory: tests/integration
        run: |
          before_try=$(grep "pathname.*Try-Tiny" cpanfile.snapshot)
          before_dbd=$(grep "pathname.*DBD-SQLite" cpanfile.snapshot)
          before_dbi=$(grep "pathname.*DBI-" cpanfile.snapshot)

          carton update Try::Tiny

          after_try=$(grep "pathname.*Try-Tiny" cpanfile.snapshot)
          after_dbd=$(grep "pathname.*DBD-SQLite" cpanfile.snapshot)
          after_dbi=$(grep "pathname.*DBI-" cpanfile.snapshot)

          echo "Try::Tiny before: $before_try"
          echo "Try::Tiny after:  $after_try"
          echo "DBD::SQLite:      $before_dbd (unchanged)"

          if [ "$before_try" = "$after_try" ]; then
            echo "FAIL: carton update Try::Tiny made no change — snapshot still pinned to $before_try"
            exit 1
          fi
          if [ "$before_dbd" != "$after_dbd" ]; then
            echo "FAIL: carton update Try::Tiny changed DBD::SQLite ($before_dbd -> $after_dbd)"
            exit 1
          fi
          if [ "$before_dbi" != "$after_dbi" ]; then
            echo "FAIL: carton update Try::Tiny changed DBI ($before_dbi -> $after_dbi)"
            exit 1
          fi
          echo "OK: Try::Tiny updated, DBD::SQLite and DBI unchanged"

      - name: Re-bundle after update
        working-directory: tests/integration
        run: |
          carton bundle
          tar czf /tmp/cpan-bundle-updated.tar.gz ./vendor cpanfile cpanfile.snapshot

      - name: cpm install from updated bundle (offline)
        run: |
          mkdir -p /tmp/work-updated /tmp/perl-install-updated
          tar xzf /tmp/cpan-bundle-updated.tar.gz -C /tmp/work-updated
          rm /tmp/work-updated/cpanfile.snapshot
          cd /tmp/work-updated && cpm install -L /tmp/perl-install-updated \
            --resolver "02packages,file://$PWD/vendor/cache"

      - name: Verify modules load from updated bundle and Try::Tiny was upgraded
        run: PERL5LIB=/tmp/perl-install-updated/lib/perl5 perl tests/integration/test-load-updated.pl

  container-build:
    # Full end-to-end Containerfile build against the curated ~11-module test
    # cpanfile (tests/container-build/). Exercises perl-src compile, all four
    # stages of Containerfile, Containerfile.deps, deps.sh, build-image.sh,
    # and the Oracle Instant Client extraction path.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman

      - name: Cache artifacts/
        uses: actions/cache@v4
        with:
          path: artifacts
          # Rebuild cache whenever the fetch script (URLs or pins) changes.
          key: artifacts-${{ hashFiles('scripts/fetch-artifacts.sh') }}

      - name: Fetch artifacts (skipped when cache hit)
        run: scripts/fetch-artifacts.sh

      - name: Assemble container-build workspace
        id: workspace
        run: echo "WORKDIR=$(bash tests/container-build/setup.sh)" >> "$GITHUB_OUTPUT"

      - name: make bundle (perl-src compile + carton install + carton bundle)
        working-directory: ${{ steps.workspace.outputs.WORKDIR }}
        run: make bundle

      - name: make all (base + dev + runtime)
        working-directory: ${{ steps.workspace.outputs.WORKDIR }}
        run: make all

      - name: make test-load-dev
        working-directory: ${{ steps.workspace.outputs.WORKDIR }}
        run: make test-load-dev

      - name: make test-load-runtime
        working-directory: ${{ steps.workspace.outputs.WORKDIR }}
        run: make test-load-runtime

      - name: Invariant checks (no build tools in runtime, non-root user, bundle-hash label)
        working-directory: ${{ steps.workspace.outputs.WORKDIR }}
        run: |
          set -e

          # Runtime must have no gcc/make
          if podman run --rm myapp:runtime sh -c 'command -v gcc || command -v make' 2>/dev/null; then
            echo "FAIL: runtime image contains build tools"
            exit 1
          fi
          echo "OK: runtime has no build tools"

          # Runtime must run as uid 1001
          uid=$(podman run --rm myapp:runtime id -u)
          if [ "$uid" != "1001" ]; then
            echo "FAIL: runtime uid=$uid, expected 1001"
            exit 1
          fi
          echo "OK: runtime runs as uid 1001"

          # Bundle hash label must match cpanfile.snapshot hash
          snapshot_hash=$(sha256sum cpanfile.snapshot | cut -c1-12)
          image_hash=$(podman inspect myapp:runtime --format '{{index .Config.Labels "bundle.hash"}}')
          if [ "$snapshot_hash" != "$image_hash" ]; then
            echo "FAIL: bundle-hash label='$image_hash' != cpanfile.snapshot hash='$snapshot_hash'"
            exit 1
          fi
          echo "OK: bundle-hash label matches snapshot ($image_hash)"
